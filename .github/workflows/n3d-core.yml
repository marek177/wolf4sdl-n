name: N3D Core C++98

on:
  push:
    branches:
      - feature/nitemare3d-bootstrap
  pull_request:
    paths:
      - "n3d/**"
      - "wl_draw.cpp"
      - "wl_main.cpp"
      - ".github/workflows/n3d-core.yml"

jobs:
  core-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Nitemare3D core
        run: |
          mkdir -p build/n3d-core
          for src in \
            n3d/n3d_data.cpp \
            n3d/n3d_world.cpp \
            n3d/n3d_collision.cpp \
            n3d/n3d_door.cpp \
            n3d/n3d_guard.cpp \
            n3d/n3d_object.cpp \
            n3d/n3d_projectile.cpp \
            n3d/n3d_render_bridge.cpp \
            n3d/n3d_runtime.cpp \
            n3d/n3d_main.cpp
          do
            obj="build/n3d-core/$(basename "${src%.cpp}").o"
            g++ -std=c++98 -Wall -Wextra -Werror -pedantic -I. -In3d -c "$src" -o "$obj"
          done

      - name: Run Nitemare3D GUARD AI core tests
        run: |
          g++ -std=c++98 -Wall -Wextra -Werror -pedantic -I. -In3d \
            tests/n3d_guard_ai_test.cpp \
            n3d/n3d_data.cpp \
            n3d/n3d_world.cpp \
            n3d/n3d_collision.cpp \
            n3d/n3d_door.cpp \
            n3d/n3d_guard.cpp \
            n3d/n3d_object.cpp \
            -o build/n3d-core/n3d_guard_ai_test
          build/n3d-core/n3d_guard_ai_test

      - name: Run Nitemare3D projectile core tests
        run: |
          g++ -std=c++98 -Wall -Wextra -Werror -pedantic -I. -In3d \
            tests/n3d_projectile_test.cpp \
            n3d/n3d_data.cpp \
            n3d/n3d_world.cpp \
            n3d/n3d_collision.cpp \
            n3d/n3d_door.cpp \
            n3d/n3d_guard.cpp \
            n3d/n3d_object.cpp \
            n3d/n3d_projectile.cpp \
            -o build/n3d-core/n3d_projectile_test
          build/n3d-core/n3d_projectile_test

      - name: Run Nitemare3D OBJECT animation tests
        run: |
          g++ -std=c++98 -Wall -Wextra -Werror -pedantic -I. -In3d \
            tests/n3d_object_animation_test.cpp \
            n3d/n3d_data.cpp \
            n3d/n3d_world.cpp \
            n3d/n3d_collision.cpp \
            n3d/n3d_door.cpp \
            n3d/n3d_guard.cpp \
            n3d/n3d_object.cpp \
            -o build/n3d-core/n3d_object_animation_test
          build/n3d-core/n3d_object_animation_test

  wolf4sdl-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL 1.2 development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl1.2-dev libsdl-mixer1.2-dev
      - name: Build Wolf4SDL with Nitemare3D integration
        run: make -j2 NO_DEPS=1
